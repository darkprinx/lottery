# See https://pre-commit.com for more information
# Install locally: uv run pre-commit install
# Run on all files: uv run pre-commit run --all-files

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-added-large-files
        args: [ '--maxkb=1000' ]
      - id: debug-statements
      - id: mixed-line-ending

  # Ruff for fast linting and formatting (replaces black, flake8, isort, etc.)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff
        args: ["--fix"]  # Autofix trivial issues where possible
      - id: ruff-format

  # Type checking with mypy - disabled in pre-commit, run separately with 'uv run mypy .'
  # The mypy hook requires full Django setup which is not available in pre-commit's isolated env
  # - repo: https://github.com/pre-commit/mirrors-mypy
  #   rev: v1.13.0
  #   hooks:
  #     - id: mypy
  #       additional_dependencies:
  #         - django-stubs
  #         - djangorestframework-stubs
  #         - types-requests
  #         - Django==4.1.4
  #         - djangorestframework==4.1.4
  #         - drf-yasg==1.21.4
  #         - APScheduler==3.9.1.post1
  #       args: [ "--config-file=pyproject.toml", "--no-namespace-packages" ]
  #       exclude: "^(migrations/|.*/migrations/)"
  #       pass_filenames: false
  #       always_run: false

  # Django specific checks
  - repo: https://github.com/rtts/djhtml
    rev: 3.0.7
    hooks:
      - id: djhtml
        args: [ "--tabwidth", "2" ]
